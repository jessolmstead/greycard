<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454545"/>
      <stop offset="1" stop-color="#303030"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#ground)"/>
  <!-- three cards, 160 by 290, fanned 18 degrees apart about (300, 456);
       the group is shifted so the fan's bounding box sits on the tile's center -->
  <g transform="translate(33.6 -73.2)">
    <g transform="rotate(-36 300 456)">
      <rect x="220" y="166" width="160" height="290" rx="14" fill="#0d0d0d" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4"/>
    </g>
    <g transform="rotate(-18 300 456)">
      <rect x="220" y="166" width="160" height="290" rx="14" fill="#000" fill-opacity="0.45" filter="url(#soft)" transform="translate(-6 6)"/>
      <rect x="220" y="166" width="160" height="290" rx="14" fill="#f2f2f2"/>
    </g>
    <rect x="220" y="166" width="160" height="290" rx="14" fill="#000" fill-opacity="0.45" filter="url(#soft)" transform="translate(-6 6)"/>
    <rect x="220" y="166" width="160" height="290" rx="14" fill="#777777"/>
  </g>
</svg>
