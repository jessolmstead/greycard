# The editor's Report a problem... opens this form with `version`,
# `os`, `gpu` and `log` filled in from the URL, by id
# (crates/greycard-ui/src/report.rs). Renaming one of those ids breaks
# that; change both together.
name: Bug report
description: Something in greycard is wrong or crashes.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: camera-lens
    attributes:
      label: Camera and lens
      placeholder: "Canon EOS R6 Mark II, RF 24-105mm f/4L"
    validations:
      required: false
  - type: textarea
    id: raw-file
    attributes:
      label: The raw file
      description: >
        A link to the file if you can share it, otherwise its file
        type and size. A raw that renders wrong is the single most
        useful thing you can send.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      description: >
        The system and its version. On Linux, the distribution, and
        whether it is Wayland or X11.
      placeholder: "Fedora Linux 41, GNOME on Wayland"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      description: The graphics card or chip, and its driver if you know it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: greycard version
      description: >
        The output of `greycard --version` or `greycard-ui --version`;
        the log's first line says it too.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The log
      description: >
        The editor keeps `greycard-ui.log`: in `~/Library/Logs/greycard`
        on a Mac, `~/.local/state/greycard` on Linux,
        `%LOCALAPPDATA%\greycard\logs` on Windows. Drag it in here.
        `greycard-ui.log.1` beside it is the run before, the one to send
        if greycard closed on its own. For the command line, paste what
        it printed.
    validations:
      required: false
