# Cut a release from a v* tag: build both binaries on each platform,
# roll the package scripts/package.sh makes there, and attach them all
# to one GitHub release.
#
# The Linux runner is the oldest Ubuntu GitHub still offers, because
# the glibc a binary is linked against is the floor of what it will run
# on and ubuntu-24.04's 2.39 is already newer than some desktops out
# there. Ubuntu 22.04 went into deprecation on 2026-09-17 with brownouts
# that fail jobs outright, so 24.04 is the floor until 26.04 takes its
# turn. The macOS runner is Apple silicon, which is the only Mac the
# tarball is for; the floor there is Dawn's 13.4, set in Info.plist,
# not the runner's.
#
# The Windows runner has to carry an MSVC toolset at least as new as
# the one ort's prebuilt onnxruntime.lib was compiled with, which for
# ort 2.0.0-rc.13 is 14.51.36231: an older one fails the link of
# onnxruntime.dll (scripts/ort-dylib.sh) with unresolved __std_*
# symbols out of the MSVC STL and nowhere earlier.
# windows-2025 took Visual Studio 2026, and that toolset with it, in
# June 2026. The step below prints what is actually installed, so a
# link failure is read off the log rather than guessed at; if the image
# has gone backwards, windows-2025-vs2026 is the label that pins it.
#
# Windows on ARM is a fourth leg, on windows-11-arm, GitHub's hosted
# ARM64 runner (Visual Studio 2022 with the ARM64 toolset, and Git
# Bash). It builds the same two binaries natively and ships no ONNX
# Runtime or Dawn: pyke's one ARM64 Windows build carries DirectML,
# which greycard does not use, and none carries WebGPU, so there is
# nothing to make our runtime from. The leg skips that step (its
# matrix row says runtime: none), and the models run on Microsoft's
# CPU-only runtime, which greycard offers to fetch on first use.
# Package.sh takes the Visual C++ runtime from the arm64
# redistributable there. The leg is new and nobody has run its
# package on a Windows ARM machine yet, so it may fail without
# holding up the other three (tentative: true, read by
# continue-on-error); the release takes whatever packages were built,
# and its globs need only one zip to match. The workflow in
# arm-package.yml builds the same package by hand from any branch,
# for a tester before a release.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: version from the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A tag name reaches a shell further down, so it has to be a
          # version and nothing else: starting with a digit, so that a
          # tag like "victory" is not read as version "ictory".
          case "$version" in
            "" | "$GITHUB_REF_NAME" | [!0-9]* | *[!0-9A-Za-z.+-]*)
              echo "tag $GITHUB_REF_NAME is not a v<version> tag" >&2
              exit 1
              ;;
          esac
          # The build's own idea of its version comes from Cargo.toml,
          # and the update check compares that with the latest tag: a
          # tag ahead of Cargo.toml would ship a build that offers
          # itself as an update forever. So the two must agree.
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$crate" != "$version" ]; then
            echo "tag says $version but Cargo.toml says $crate; bump the workspace version first" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A version with a -rc or -beta on it goes out marked as a
          # pre-release. A plain 0.x is a release: the number already
          # says how far along it is, and the flag would only leave the
          # repo without a "latest" release for a tester or an update
          # check to find.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: ${{ matrix.package }} package
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package: x86_64-linux
            ext: tar.gz
          - os: macos-15
            package: aarch64-macos
            ext: tar.gz
          - os: windows-2025
            package: x86_64-windows
            ext: zip
            host: x86_64-pc-windows-msvc
          # No runtime of ours on this one, and allowed to fail: see
          # the header.
          - os: windows-11-arm
            package: aarch64-windows
            ext: zip
            host: aarch64-pc-windows-msvc
            runtime: none
            tentative: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.tentative == true }}
    # package.sh is /bin/sh, and the Windows runner's default shell is
    # PowerShell; Git Bash is there under this name and brings the tar,
    # find and sort the script asks for.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Native libraries
        # The set CI installs bar lcms2: fontconfig and wayland for
        # Slint's backend, xkbcommon for its keyboard. lcms2 is built
        # from lcms2-sys's own source instead; see the next step.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev pkg-config

      - name: Static lcms2
        # lcms2-sys asks pkg-config first and only builds its vendored
        # copy when that finds nothing. The macOS image has Homebrew's
        # pkg-config and little-cms2 on it, so v0.1.0 linked
        # /opt/homebrew/opt/little-cms2/lib/liblcms2.2.dylib and failed
        # at launch on every Mac without it. LCMS2_STATIC skips the
        # probe; it is read as set-or-not, so it goes into the
        # environment only here rather than as an empty value elsewhere.
        # Linux takes it too, so neither the tarball nor the AppImage
        # asks the host for liblcms2.so.2, which a bare desktop may
        # not have; scripts/appimage.sh fails if it creeps back.
        run: echo "LCMS2_STATIC=1" >> "$GITHUB_ENV"

      - name: MSVC toolsets on this runner
        # Printed before the build, not after it fails: the link error
        # this guards against names a dozen __std_* symbols and not the
        # toolset, and the header above says which version is wanted.
        # package.sh takes the redistributable DLLs out of the same
        # installation, so a missing one shows here too: x64 on the
        # x86-64 runner, arm64 on the ARM one, whose files are listed
        # as well, since the four package.sh wants there have not been
        # seen yet.
        if: runner.os == 'Windows'
        run: |
          ls -d "/c/Program Files"*"/Microsoft Visual Studio"/*/*/VC/Tools/MSVC/*/ \
            2>/dev/null || echo "no VC/Tools/MSVC directory found"
          ls -d "/c/Program Files"*"/Microsoft Visual Studio"/*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT \
            2>/dev/null || echo "no x64 VC redistributable directory found"
          ls "/c/Program Files"*"/Microsoft Visual Studio"/*/*/VC/Redist/MSVC/*/arm64/Microsoft.VC*.CRT \
            2>/dev/null || echo "no arm64 VC redistributable directory found"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          # llvm-readobj, for the Windows binaries' imports below.
          components: llvm-tools

      # The toolchain is the leg's own: an x86-64 one on the ARM
      # runner would build, under emulation, a package for the other
      # Windows, and fail only at Package with a missing ONNX Runtime
      # that says nothing of why. The host is the triple package.sh
      # names the zip from.
      - name: The toolchain's host is the leg's
        if: matrix.host
        env:
          WANTED: ${{ matrix.host }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "rustc host: $host"
          if [ "$host" != "$WANTED" ]; then
            echo "this leg wants a $WANTED toolchain, and rustc's host is $host" >&2
            exit 1
          fi

      # Nikon High Efficiency decoding (the nikon-he feature) stays out
      # of every published build: JPEG XS is licensed per copy of a
      # decoder. This fails the release if anything turns rawler's
      # decoder on. The tree is taken first so that a cargo tree that
      # fails fails the step, rather than giving grep nothing to find.
      - name: No JPEG XS decoder in the dependency tree
        run: |
          tree=$(cargo tree --locked -p greycard-ui -p greycard-cli -e features -i rawler)
          if grep -q jpegxs <<<"$tree"; then
            echo "rawler's jpegxs feature is on in the release build"
            exit 1
          fi

      # No build cache here, on purpose: a release is rare enough to pay
      # for a cold build, and builds exactly what the tree says.
      # --locked: the lockfile is committed, and one dependency is
      # pinned to a git revision. A release builds what it says it does.
      - name: Build
        run: cargo build --locked --release -p greycard-ui -p greycard-cli

      # ONNX Runtime as a shared library, made from pyke's static build
      # and left with Dawn in target/release for package.sh. The
      # binaries load it at first use and link none of it: linked in,
      # its x86-64-v3 initializers killed an older processor at exec.
      # Skipped by a matrix row rather than by runner.arch, so that the
      # row says what its package carries: on Windows on ARM pyke has
      # no WebGPU build to make one from, and ort-dylib refuses there.
      - name: ONNX Runtime library
        if: matrix.runtime != 'none'
        run: scripts/ort-dylib.sh release

      # Checked on what was built: neither binary may name ONNX Runtime
      # or Dawn as a library to load at exec, or a processor without
      # AVX2 dies before main again. macOS lists them with otool, Linux
      # with readelf, Windows with the llvm-readobj rustup ships in
      # llvm-tools (Git Bash has no dumpbin or objdump).
      - name: Nothing of ONNX Runtime or Dawn loaded at exec
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          sysroot=$(rustc --print sysroot)
          if [ "$RUNNER_OS" = Windows ]; then
            sysroot=$(cygpath -u "$sysroot")
          fi
          readobj="$sysroot/lib/rustlib/$host/bin/llvm-readobj"
          for bin in target/release/greycard target/release/greycard-ui; do
            if [ "$RUNNER_OS" = macOS ]; then
              needed=$(otool -L "$bin")
            elif [ "$RUNNER_OS" = Windows ]; then
              needed=$("$readobj.exe" --coff-imports "$bin.exe")
              # An empty answer would pass the grep below without
              # having looked at anything.
              if ! grep -qi 'kernel32' <<<"$needed"; then
                echo "llvm-readobj listed no imports for $bin.exe:"
                echo "$needed"
                exit 1
              fi
            else
              needed=$(readelf -d "$bin")
            fi
            if grep -Eqi 'onnxruntime|webgpu_dawn' <<<"$needed"; then
              echo "$bin links ONNX Runtime or Dawn at exec:"
              echo "$needed"
              exit 1
            fi
          done
          # glibc 2.41 and later refuse to dlopen a library that asks for
          # an executable stack, and the AI features go off with it.
          if [ "$RUNNER_OS" = Linux ]; then
            for lib in target/release/*.so; do
              [ -f "$lib" ] || continue
              if readelf -lW "$lib" | grep -E 'GNU_STACK' | grep -q 'RWE'; then
                echo "$lib asks for an executable stack"
                exit 1
              fi
            done
          fi

      # The JPEG XS check again, on what was built: every error rawler's
      # JPEG XS decoder can return names the format, so a binary with the
      # decoder in it carries the text and one without it does not.
      - name: No JPEG XS decoder in the binaries
        run: |
          for bin in target/release/greycard target/release/greycard-ui; do
            if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
            test -f "$bin"
            if grep -qa 'JPEG XS' "$bin"; then
              echo "$bin carries the JPEG XS decoder"
              exit 1
            fi
          done

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/package.sh "$VERSION"

      - name: What is in the package
        env:
          ARCHIVE: target/dist/greycard-${{ needs.version.outputs.version }}-${{ matrix.package }}.${{ matrix.ext }}
        # Git for Windows brings no unzip, so the zip is listed through
        # PowerShell, the same way scripts/zip.ps1 wrote it.
        run: |
          case "$ARCHIVE" in
          *.zip)
            powershell -NoProfile -Command "Add-Type -AssemblyName System.IO.Compression.FileSystem; [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path '$ARCHIVE')).Entries | Select-Object Length, FullName | Format-Table -AutoSize"
            ;;
          *) tar tzf "$ARCHIVE" ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-${{ matrix.package }}
          path: target/dist/greycard-${{ needs.version.outputs.version }}-${{ matrix.package }}.${{ matrix.ext }}
          if-no-files-found: error
          # The release below is the copy that matters; this one only
          # has to outlive the workflow run.
          retention-days: 7

      # The AppImage, beside the tarball rather than instead of it: one
      # file to download, make executable and run, for a tester who
      # would rather not install anything. Built from the tarball's own
      # staging directory, so the two carry the same files.
      - name: AppImage
        if: matrix.os == 'ubuntu-24.04'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/appimage.sh "$VERSION"

      # The AppDir as it went in, and both binaries started through the
      # image's AppRun as a user would start them. --version needs no
      # display or GPU, so this proves the image mounts (here extracts),
      # that AppRun finds the editor, and that --cli finds the command
      # line.
      - name: What is in the AppImage
        if: matrix.os == 'ubuntu-24.04'
        env:
          APPIMAGE: target/dist/greycard-${{ needs.version.outputs.version }}-linux-x86_64.AppImage
          APPDIR: target/dist/greycard-${{ needs.version.outputs.version }}-linux-x86_64.AppDir
        run: |
          (cd "$APPDIR" && find . | LC_ALL=C sort)
          ls -l "$APPIMAGE"
          "./$APPIMAGE" --appimage-extract-and-run --version
          "./$APPIMAGE" --appimage-extract-and-run --cli --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: package-x86_64-linux-appimage
          path: target/dist/greycard-${{ needs.version.outputs.version }}-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: target/dist
          merge-multiple: true

      # The release's text is the changelog's section for this version:
      # from its "## <version>" heading to the next "## ". A version with
      # no section fails here rather than shipping an empty release.
      # GitHub renders every newline in a release body as a line break, so
      # the second awk joins each wrapped paragraph and list item onto one
      # line; a blank line, a heading or a list marker starts a new one.
      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { on = ($2 == v || $2 == v",") }
            on && !/^## / { print }
          ' docs/changelog.md | awk '
            /^[[:space:]]*$/ { if (cur != "") print cur; print ""; cur = ""; next }
            /^#/ || /^[[:space:]]*([-*+]|[0-9]+\.)[[:space:]]/ {
              if (cur != "") print cur; cur = $0; next
            }
            {
              line = $0; sub(/^[[:space:]]+/, "", line)
              cur = (cur == "" ? line : cur " " line)
            }
            END { if (cur != "") print cur }
          ' > target/dist/release-notes.md
          if ! grep -q '[^[:space:]]' target/dist/release-notes.md; then
            echo "docs/changelog.md has no section for $VERSION" >&2
            exit 1
          fi
          cat target/dist/release-notes.md
          ls -l target/dist/greycard-*

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            target/dist/greycard-${{ needs.version.outputs.version }}-*.tar.gz
            target/dist/greycard-${{ needs.version.outputs.version }}-*.zip
            target/dist/greycard-${{ needs.version.outputs.version }}-*.AppImage
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          body_path: target/dist/release-notes.md

  site:
    name: rebuild greycard.org
    needs: release
    runs-on: ubuntu-24.04
    steps:
      # The site reads the changelog from master at build time, so a
      # release only has to ask Netlify for a fresh build. A separate job,
      # so a failure here never touches the release itself.
      - name: Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "no NETLIFY_BUILD_HOOK secret; the site is not rebuilt"
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$HOOK"
