# The Windows package and its installer from any branch, on request,
# for a tester to try before a release carries them: Actions, "Windows
# package", Run workflow, and the zip is the run's
# package-x86_64-windows artifact for a week, the installer
# package-x86_64-windows-setup.
#
# Its own file, as arm-package.yml is, for the reason given there. The
# steps are release.yml's x86_64-windows leg, less the release: the
# same runner, the same checks on the toolchain and on what was built,
# our ONNX Runtime made by scripts/ort-dylib.sh, package.sh with no
# argument, so the version is Cargo.toml's, and the installer,
# installed and uninstalled on the runner. Unsigned: signing is
# release.yml's one step.

name: Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: x86_64-windows package
    runs-on: windows-2025
    # package.sh is /bin/sh; Git Bash is there under this name.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # As in release.yml: lcms2 from lcms2-sys's own source.
      - name: Static lcms2
        run: echo "LCMS2_STATIC=1" >> "$GITHUB_ENV"

      # As in release.yml: the toolsets, which ort's onnxruntime.lib
      # needs one new enough of, and the x64 redistributable package.sh
      # takes the Visual C++ runtime from, before the build.
      - name: MSVC toolsets on this runner
        run: |
          ls -d "/c/Program Files"*"/Microsoft Visual Studio"/*/*/VC/Tools/MSVC/*/ \
            2>/dev/null || echo "no VC/Tools/MSVC directory found"
          ls -d "/c/Program Files"*"/Microsoft Visual Studio"/*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT \
            2>/dev/null || echo "no x64 VC redistributable directory found"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          # llvm-readobj, for the binaries' imports below.
          components: llvm-tools

      - name: The toolchain's host is x86_64-pc-windows-msvc
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "rustc host: $host"
          if [ "$host" != x86_64-pc-windows-msvc ]; then
            echo "this package wants an x86_64-pc-windows-msvc toolchain, and rustc's host is $host" >&2
            exit 1
          fi

      # Nikon High Efficiency decoding stays out of anything handed to
      # a tester, as out of a release; see release.yml.
      - name: No JPEG XS decoder in the dependency tree
        run: |
          tree=$(cargo tree --locked -p greycard-ui -p greycard-cli -e features -i rawler)
          if grep -q jpegxs <<<"$tree"; then
            echo "rawler's jpegxs feature is on in the build"
            exit 1
          fi

      # As in release.yml: ONNX Runtime and Dawn as libraries beside
      # the binaries, before the build.
      - name: ONNX Runtime library
        run: scripts/ort-dylib.sh release

      - name: Build
        run: cargo build --locked --release -p greycard-ui -p greycard-cli

      # As in release.yml: neither binary names ONNX Runtime or Dawn
      # as a library to load at exec.
      - name: Nothing of ONNX Runtime or Dawn loaded at exec
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          sysroot=$(cygpath -u "$(rustc --print sysroot)")
          readobj="$sysroot/lib/rustlib/$host/bin/llvm-readobj"
          for bin in target/release/greycard target/release/greycard-ui; do
            needed=$("$readobj.exe" --coff-imports "$bin.exe")
            if ! grep -qi 'kernel32' <<<"$needed"; then
              echo "llvm-readobj listed no imports for $bin.exe:"
              echo "$needed"
              exit 1
            fi
            if grep -Eqi 'onnxruntime|webgpu_dawn' <<<"$needed"; then
              echo "$bin links ONNX Runtime or Dawn at exec:"
              echo "$needed"
              exit 1
            fi
          done

      - name: No JPEG XS decoder in the binaries
        run: |
          for bin in target/release/greycard.exe target/release/greycard-ui.exe; do
            test -f "$bin"
            if grep -qa 'JPEG XS' "$bin"; then
              echo "$bin carries the JPEG XS decoder"
              exit 1
            fi
          done

      # For package.sh's THIRD-PARTY-NOTICES; see release.yml.
      - name: cargo-about from the cache
        id: cargo-about
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/cargo-about
            ~/.cargo/bin/cargo-about.exe
          key: cargo-about-0.9.3-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install cargo-about --locked --version 0.9.3 --features cli

      # No argument: the version is the workspace's, from cargo
      # metadata.
      - name: Package
        run: scripts/package.sh

      - name: What is in the package
        run: |
          zip=$(ls target/dist/greycard-*-x86_64-windows.zip)
          powershell -NoProfile -Command "Add-Type -AssemblyName System.IO.Compression.FileSystem; [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path '$zip')).Entries | Select-Object Length, FullName | Format-Table -AutoSize"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-x86_64-windows
          path: target/dist/greycard-*-x86_64-windows.zip
          if-no-files-found: error
          retention-days: 7

      # As in release.yml: the compiler, the installer from the zip's
      # staging directory, and a round trip on the runner.
      - name: Inno Setup
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass \
            -File scripts/inno-setup.ps1 -Destination "$RUNNER_TEMP\\innosetup"

      - name: Installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-setup.ps1

      - name: The installer, installed and uninstalled
        run: |
          setup=$(ls target/dist/greycard-*-x86_64-windows-setup.exe)
          version=${setup#target/dist/greycard-}
          version=${version%-x86_64-windows-setup.exe}
          powershell -NoProfile -ExecutionPolicy Bypass \
            -File scripts/windows-setup-check.ps1 -Setup "$setup" -Version "$version"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-x86_64-windows-setup
          path: target/dist/greycard-*-x86_64-windows-setup.exe
          if-no-files-found: error
          retention-days: 7
