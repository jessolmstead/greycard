# What the pre-push hook in hooks/ asks of a change, run somewhere that
# is not one machine: formatted, no clippy warnings, tests green. The
# ignored tests want raw files and models and are not run here.
#
# On Linux, macOS and Windows, since the file chooser, the monitor
# profile and the window subsystem each have a Linux side and an
# everywhere-else side behind cfg, and a change to one cannot be seen
# to compile from the others. The Mac runner is Apple silicon and, on
# a private repo, costs ten Linux minutes to the minute; drop it from
# the matrix if that is too dear.
#
# windows-2025 has to carry an MSVC toolset at least as new as the one
# ort's prebuilt onnxruntime.lib was compiled with, 14.51.36231 for ort
# 2.0.0-rc.13, or the link fails on unresolved __std_* symbols out of
# the MSVC STL and nowhere earlier; release.yml's header has the rest
# of that story. windows-2025 took Visual Studio 2026 in June 2026;
# windows-2025-vs2026 is the label to pin if that image goes backwards.
name: CI

on:
  push:
  pull_request:
  # Weekly, so an advisory filed against a lock file that has not
  # changed is still seen; only the audit job runs then.
  schedule:
    - cron: '17 5 * * 1'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info in CI: a test names its own file and line when it
  # fails, and the debug sections for wgpu, ort, Slint and rawler are
  # most of a build that filled the Linux runner's disk on 2026-09-21.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    if: github.event_name != 'schedule'
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    # Git Bash is on every Windows runner under this name and gives the
    # three OSes the one shell, the same call release.yml makes; the
    # Linux and Mac runners already default to bash so this changes
    # nothing for them.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Room to build
        # The hosted image ships .NET, Android and Haskell toolchains
        # this build never uses, some fourteen gigabytes of the disk
        # the test build ran out of.
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Native libraries
        # lcms2 for the profiles, fontconfig and wayland for Slint's
        # backend, xkbcommon for its keyboard, and Mesa's Vulkan
        # drivers for lavapipe, the software GPU the GPU tests run on:
        # a hosted runner has no other adapter, and without one every
        # GPU-against-CPU test returned at its first line and passed
        # green without running. A Mac needs nothing beyond Xcode's
        # tools, and neither does Windows, where lcms2 builds from its
        # own source with no pkg-config to find one.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            liblcms2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            pkg-config mesa-vulkan-drivers

      - name: MSVC toolsets on this runner
        # Printed before the build, not after it fails: an older
        # toolset than the header names fails at link with a dozen
        # __std_* symbols and not a word about the toolset itself.
        if: runner.os == 'Windows'
        run: |
          ls -d "/c/Program Files"*"/Microsoft Visual Studio"/*/*/VC/Tools/MSVC/*/ \
            2>/dev/null || echo "no VC/Tools/MSVC directory found"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # On Linux a GPU test that finds no adapter fails instead of
        # returning, so a broken lavapipe cannot pass the GPU tests by
        # skipping them. The Mac and Windows runners are not held to
        # it: Metal under virtualization and WARP are not promised.
        # Vulkan alone, because wgpu ranks a GL adapter above a CPU
        # Vulkan one, and a GL device made off any display is lost at
        # creation (seen on NVIDIA's GL beside lavapipe); the instances
        # read WGPU_BACKEND, as wgpu's own convention has it.
        env:
          GREYCARD_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
          WGPU_BACKEND: ${{ runner.os == 'Linux' && 'vulkan' || '' }}
        run: cargo test

  # Known advisories against Cargo.lock, from the RustSec database. It
  # runs once, on Linux, since the lock file is the same everywhere. A
  # vulnerability fails it; an "unmaintained" notice prints in the log
  # and passes. (bincode 2.0.1 shows as one: it is in Cargo.lock only
  # through typed-index-collections' weak bincode? features, by way of
  # Slint's compiler, and is never compiled.)
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: cargo audit
        run: cargo audit
