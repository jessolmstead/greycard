[workspace]
resolver = "3"
members = ["crates/greycard-core", "crates/greycard-edit", "crates/greycard-cli", "crates/greycard-bench", "crates/greycard-ui", "crates/greycard-slint", "crates/greycard-render", "crates/greycard-ai", "crates/greycard-lens", "crates/greycard-gpu", "crates/greycard-library", "crates/greycard-match", "crates/ort-dylib"]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.98"
authors = ["Jess Olmstead"]
repository = "https://github.com/jessolmstead/greycard"

[workspace.dependencies]
rawler = "0.8"
rawcolor = "0.1.1"
rayon = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: every float read back as the one written. Without
# it serde_json parses some seventeen-digit numbers a unit in the last
# place off, so an f64 in a sidecar (a white balance's tint) could move
# at each save and read, and two copies of one edit compare unequal.
# Found by fuzzing; the cost is a slower parse of each float.
serde_json = { version = "1", features = ["float_roundtrip"] }
roxmltree = "0.21"
# The platform's configuration and cache directories.
dirs = "7"
# Libraries say things through `log`; the binaries collect them with
# tracing-subscriber, and tracing-log carries `log` records over.
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"

# rawler 0.8.0 reads the wrong ColorData word for the EOS R6 Mark II, R7,
# R8, R10 and R50 and declares a white level 10-17% too low (notes §13j).
# Fixed upstream in dnglab/dnglab#840; this pins a fork carrying the same
# fix until a release has it. The pinned branch, nikon-he-jpegxs, carries
# three things: that fix; dnglab/dnglab#835, Nikon High Efficiency
# decoding, behind a `jpegxs` feature that is off unless greycard's
# `nikon-he` turns it on; and our refit of #835's curve, which continues
# it below black instead of flooring it at 1050 and lowers its offset to
# 1018. The offset was measured against the camera's own JPEG between about
# 45 and 1000 DN above black, and it moves every value above the toe down
# 32 DN. The patch comes out when a release has all three. fuzz/Cargo.toml
# carries a copy of this line, its workspace being its own; change both.
[patch.crates-io]
rawler = { git = "https://github.com/jessolmstead/dnglab", rev = "7f4526a38924ac62228ffc3559c83a0ab7822ef6" }
# femtovg 0.27.0 plus one change: a render pipeline is kept through
# flushes that do not bind it, where 0.27.0 drops it at every flush and
# compiles it again next frame (§208; femtovg/femtovg#371). Upstream
# merged its own form of the fix on 2026-10-10 (femtovg/femtovg#366),
# past API changes Slint 1.18 does not build against, so this pin stays
# until Slint takes a femtovg release that carries it.
femtovg = { git = "https://github.com/jessolmstead/femtovg", rev = "befdd4dc512d05673db87e70a1586fa4f45acc36" }
# Slint 1.18.1 plus one change: once the window exists, the winit
# backend converts a logical size or position at the window's own
# scale factor, where 1.18.1 hands it to winit as logical and winit
# converts it at the system's. With SLINT_SCALE_FACTOR set, which the
# interface scale setting sets, the window collapsed by the percentage
# whenever Slint re-applied its size (1760x1018 to 880x527 at 200 % on
# X11, as the layout's least grew). Every Slint crate comes from the
# fork at the same commit: a git crate takes its path dependencies from
# its own checkout, which beside the crates.io copies would be two
# i-slint-core. Pinned until a Slint release carries the fix, sent
# upstream as slint-ui/slint#14324.
slint = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
slint-build = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
slint-macros = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-backend-android-activity = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-backend-linuxkms = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-backend-selector = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-backend-testing = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-backend-winit = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-common = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-compiler = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-core = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-core-macros = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-renderer-femtovg = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-renderer-skia = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
i-slint-renderer-software = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
vtable = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }
vtable-macro = { git = "https://github.com/jessolmstead/slint", rev = "d8686b7ad4a74c59199b272981e1c50e4af9e98d" }

# The symbol tables go: nothing in a package reads them. There is no
# crash reporter and no symbolication step, and a panic's message and
# file:line come from the panic machinery, not from the symbols; only
# a backtrace from a release build loses its function names, and a
# debug build is where one is read. On one tree, Linux, 2026-09-23:
# greycard-ui 28.8 MB smaller (111.8 to 83.0 MB), greycard 12.4 MB
# smaller (57.5 to 45.1 MB); the sizes move with the code, the saving
# much less.
[profile.release]
strip = true

# The fit's numbers built optimized in a debug build too. Unoptimized,
# a camera match test's holds (a Model::fit a frame, spread over the
# global rayon pool) run for tens of seconds, and another test's work
# queued on the same pool waits behind them past its own deadline; the
# match crate's own tests went from 73 s to 5 s with it.
[profile.dev.package.greycard-match]
opt-level = 3

# scripts/ort-dylib.sh runs its helper in the dev profile; unoptimized,
# unpacking the Windows archive's 928 MB through LZMA2 and hashing the
# download would take minutes rather than seconds.
[profile.dev.package.lzma-rust2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
