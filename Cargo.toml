[workspace]
resolver = "3"
members = [
    "crates/greycard-core",
    "crates/greycard-edit",
    "crates/greycard-edit-io",
    "crates/greycard-cli",
    "crates/greycard-bench",
    "crates/greycard-ui",
    "crates/greycard-slint",
    # A test of the translation mechanism, with a catalog of its own.
    "crates/greycard-i18n-probe",
    "crates/greycard-render",
    "crates/greycard-engine",
    "crates/greycard-viewport",
    "crates/greycard-ai",
    "crates/greycard-lens",
    "crates/greycard-gpu",
    "crates/greycard-library",
    "crates/greycard-match",
    "crates/ort-dylib",
    "crates/greycard-version",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.98"
authors = ["Jess Olmstead"]
repository = "https://github.com/jessolmstead/greycard"

# The lint levels that differ from the defaults, so the editor and CI
# agree: any lint we allow or raise workspace wide goes here, and every
# crate opts in with `[lints] workspace = true`. None differ today. CI's
# `-D warnings` (and the pre-push hook's) is what makes a warning fail,
# so the editor shows warnings as warnings; a blanket deny here would
# stop every plain build on one, a newer toolchain's new lint among
# them.
[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.dependencies]
rawler = "0.8"
rawcolor = "0.1.1"
rayon = "1"
thiserror = "2"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: every float read back as the one written. Without
# it serde_json parses some seventeen-digit numbers a unit in the last
# place off, so an f64 in a sidecar (a white balance's tint) could move
# at each save and read, and two copies of one edit compare unequal.
# Found by fuzzing; the cost is a slower parse of each float.
serde_json = { version = "1", features = ["float_roundtrip"] }
roxmltree = "0.21"
# The platform's configuration and cache directories.
dirs = "7"
# Libraries say things through `log`; the binaries collect them with
# tracing-subscriber, and tracing-log carries `log` records over.
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
# Named by more than one crate. A crate that needs more features than
# an entry's adds its own beside `workspace = true`.
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
dunce = "1"
flate2 = "1"
half = "2"
lcms2 = "6"
libc = "0.2"
libm = "0.2"
memmap2 = "0.9"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
tar = "0.4"
ureq = "3"
wgpu = "30"
windows-sys = "0.59"
winresource = "0.1"
# One Slint for greycard-slint and greycard-ui: the editor's whole
# feature list, so the two crates name the same Slint. Build
# greycard-slint through greycard-ui (see its manifest).
slint = { version = "1.19", features = ["unstable-wgpu-30", "unstable-winit-030", "renderer-femtovg-wgpu"] }

# The pinned branch, float-deflate-pin, is upstream main at 01f3f092
# (which has dnglab/dnglab#840, the EOS R6 Mark II's white level, and
# dnglab/dnglab#880, an ORF's preview) and five things on top:
# dnglab/dnglab#896, Deflate compressed floating point DNGs;
# dnglab/dnglab#925, a Panasonic v4 window read within its block;
# dnglab/dnglab#929, lenses sharing an id told apart by the EXIF
# LensSpecification;
# dnglab/dnglab#937, the Canon EOS R8 Mark II; and
# dnglab/dnglab#835, Nikon High Efficiency decoding, behind a `jpegxs`
# feature that is off unless greycard's `nikon-he` turns it on, with our
# refit of #835's curve, which continues it below black instead of
# flooring it at 1050 and lowers its offset to 1018. The offset was
# measured against the camera's own JPEG between about 45 and 1000 DN
# above black, and it moves every value above the toe down 32 DN. The
# patch comes out when a release has both. fuzz/Cargo.toml carries a
# copy of this line, its workspace being its own; change both.
[patch.crates-io]
rawler = { git = "https://github.com/jessolmstead/dnglab", rev = "eb997fb7a99b09c0eaab8e378574d8f11a7d58c3" }

# The symbol tables go: nothing in a package reads them. There is no
# crash reporter and no symbolication step, and a panic's message and
# file:line come from the panic machinery, not from the symbols; only
# a backtrace from a release build loses its function names, and a
# debug build is where one is read. On one tree, Linux, 2026-09-23:
# greycard-ui 28.8 MB smaller (111.8 to 83.0 MB), greycard 12.4 MB
# smaller (57.5 to 45.1 MB); the sizes move with the code, the saving
# much less.
[profile.release]
strip = true

# The fit's numbers built optimized in a debug build too. Unoptimized,
# a camera match test's holds (a Model::fit a frame, spread over the
# global rayon pool) run for tens of seconds, and another test's work
# queued on the same pool waits behind them past its own deadline; the
# match crate's own tests went from 73 s to 5 s with it.
[profile.dev.package.greycard-match]
opt-level = 3

# The generated UI is the largest compile in the tree: line tables only
# take 1.3 to 2 GB off rustc's peak and keep backtraces' line numbers.
# A debugger shows no local variables inside the generated code.
[profile.dev.package.greycard-slint]
debug = "line-tables-only"

# scripts/ort-dylib.sh runs its helper in the dev profile; unoptimized,
# unpacking the Windows archive's 928 MB through LZMA2 and hashing the
# download would take minutes rather than seconds.
[profile.dev.package.lzma-rust2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
