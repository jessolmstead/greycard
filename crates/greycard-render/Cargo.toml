[package]
name = "greycard-render"
version.workspace = true
description = "A developed frame made into a picture or a file: the finish, AgX, the detail bands, the geometry, the border, the watermark and the export"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]

[dependencies]
greycard-core = { path = "../greycard-core" }
greycard-edit = { path = "../greycard-edit" }
rayon.workspace = true
image.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The detail bands and the viewport's upload are half floats, and the
# export's ICC profiles and conversions are lcms2's. Both are
# greycard-ui's, feature for feature, so a build of this crate alone
# resolves them as the editor's build does.
half = { workspace = true, features = ["bytemuck"] }
lcms2.workspace = true
# The watermark's text: the system's sans-serif found the way Slint
# finds its own, and rasterized. Both already in the tree; fontique at
# the version Slint's parley takes, so there is one, and one font scan.
fontique = "0.12"
ab_glyph = "0.2"
# A character's script, for the font fallback. Already in the tree.
unicode-script = "0.5"
# The WebP export: lossless only, pure Rust, and already in the tree
# under the image crate and resvg. Named straight because the image
# crate's encoder takes no XMP; its `webp` feature, the decoder too,
# stays off, so no WebP is read as a picture.
image-webp = "0.2"

[features]
# The test helpers the editor's own tests share with these (a camera
# profile, a scratch folder's removal, a watermark picture), and the
# references the viewport's tests hold it to. Turned on by the
# dev-dependencies of greycard-ui, greycard-engine, and
# greycard-viewport, and by greycard-engine's own `testing`.
testing = ["greycard-core/testing"]

[dev-dependencies]
# The scratch folder's removal the tests share.
greycard-core = { path = "../greycard-core", features = ["testing"] }
# The WebP export read back: its pixels, profile, EXIF, and XMP.
image = { workspace = true, features = ["webp"] }
