[package]
name = "greycard-cli"
version.workspace = true
description = "Command-line RAW pre-processor built on greycard-core"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "greycard"
path = "src/main.rs"

[dependencies]
greycard-core = { path = "../greycard-core" }
greycard-ai = { path = "../greycard-ai" }
greycard-lens = { path = "../greycard-lens" }
greycard-edit = { path = "../greycard-edit" }
greycard-library = { path = "../greycard-library" }
image.workspace = true
clap.workspace = true
anyhow.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true

# The icon and the version fields Explorer and the file properties
# sheet read out of the executable itself. Windows only: every other
# desktop takes its icon from the .desktop entry or the bundle beside
# the binary.
[target."cfg(windows)".build-dependencies]
winresource = "0.1"
