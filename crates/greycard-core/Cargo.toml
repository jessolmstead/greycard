[package]
name = "greycard-core"
version.workspace = true
description = "RAW development engine: decode, white balance and camera color, correctly"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
rawler.workspace = true
image.workspace = true
rawcolor.workspace = true
rayon.workspace = true
thiserror.workspace = true

[features]
# Nikon High Efficiency (HE and HE*) raws, through rawler's JPEG XS
# decoder. Off by default and in every published build: JPEG XS is
# licensed by a patent pool per copy of a decoder, with no exemption
# for free software. Someone building for themselves can turn it on.
nikon-he = ["rawler/jpegxs"]
