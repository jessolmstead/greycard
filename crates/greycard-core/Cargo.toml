[package]
name = "greycard-core"
version.workspace = true
description = "RAW development engine: decode, white balance and camera color, correctly"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
log.workspace = true
rawler.workspace = true
image.workspace = true
rawcolor.workspace = true
rayon.workspace = true
thiserror.workspace = true
# erf for the learned highlight fill's exact GELU; std has none.
libm.workspace = true
# rawler's table of cameras, for the names a body is sold under.
toml.workspace = true

[dev-dependencies]
# The layering test reads `cargo metadata`'s JSON.
serde_json.workspace = true
# The XMP packets parsed back, as a strict reader would.
roxmltree.workspace = true

[features]
# Nikon High Efficiency (HE and HE*) raws, through rawler's JPEG XS
# decoder. Off by default and in every published build: JPEG XS is
# licensed by a patent pool per copy of a decoder, with no exemption
# for free software. Someone building for themselves can turn it on.
nikon-he = ["rawler/jpegxs"]
# The scratch folder's removal every crate's tests share. Turned on by
# the other crates' dev-dependencies only.
testing = []
