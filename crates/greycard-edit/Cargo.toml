[package]
name = "greycard-edit"
version.workspace = true
description = "The edit: a typed, versioned description of a development in physical units, and its sidecar"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
greycard-core = { path = "../greycard-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
roxmltree.workspace = true
dirs.workspace = true
# State ids and revisions in the sidecar (§233); the hash the library
# and the editor already use for a file's identity.
blake3 = "1"
# The host's name on a revision. Already in the tree through x11rb.
gethostname = "1"

[dev-dependencies]
# A camera profile made by hand, for the local white balance's tests.
rawcolor.workspace = true

[target.'cfg(windows)'.dependencies]
# For the hidden attribute on the sidecar folder; a leading dot hides
# nothing on Windows.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
