[package]
name = "greycard-library"
version.workspace = true
description = "The library index: a rebuildable SQLite catalog of files, their EXIF and their sidecars' meta, and the filter language over it"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
greycard-core = { path = "../greycard-core" }
greycard-edit = { path = "../greycard-edit" }
serde_json.workspace = true
thiserror.workspace = true
dirs.workspace = true
# The index. Bundled, so the same SQLite is on every platform and a
# build needs no system library; `functions` for the Unicode lower
# the text filters fold through.
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
# The content hash: the first 64 KB and the size (notes §72).
blake3 = "1"
# `std::fs::canonicalize` without the `\\?\` prefix Windows puts on
# its answer, so a stored folder is a path a person would type.
dunce = "1"
# The roots' watcher: inotify on Linux, FSEvents on macOS,
# ReadDirectoryChangesW on Windows. CC0-1.0; pinned, since a watcher's
# events change shape between majors.
notify = "=8.2.0"
# The thumbnail cache's entries are JPEGs.
image.workspace = true
# The test frames' metadata is rawler's type; see `fixtures`.
rawler = { workspace = true, optional = true }

[features]
# `fixture`: frames with real EXIF for another crate's tests, the
# editor's among them. Not for a build anybody runs.
fixtures = ["dep:rawler"]

[dev-dependencies]
# The tests write small TIFFs with real EXIF through the engine's
# writer, whose metadata is rawler's type, and a PNG with none.
rawler.workspace = true
