[package]
name = "greycard-gpu"
version.workspace = true
description = "GPU implementations of greycard-core's engine ops (the sharpen, the CA correction, the lens correction, the local contrast, the dehaze, and the Bayer demosaics), checked against its CPU references"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
greycard-core = { path = "../greycard-core" }
# The major Slint 1.19 pins (notes §91): the editor hands this crate
# its own device, so the two must be one wgpu.
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true
rayon.workspace = true
thiserror.workspace = true
log.workspace = true

[dev-dependencies]
# The shader compiler wgpu carries, so `cargo test` validates the
# WGSL without a GPU.
naga.workspace = true
anyhow.workspace = true
half.workspace = true
