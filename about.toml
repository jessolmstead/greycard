# cargo-about's configuration, for THIRD-PARTY-NOTICES: scripts/notices.sh
# runs it, scripts/package.sh ships the result, and CI fails a pull
# request whose dependency tree brings in a license not listed here.
#
# Accepted: the licenses the shipped tree resolves to, each one a
# license under which a GPL-3.0-or-later binary may carry the code. The
# order is the preference where a crate offers a choice, so MIT or
# Apache-2.0 is listed under MIT. Slint is taken under GPL-3.0-only
# rather than its royalty-free or commercial licenses; rawler (our
# dnglab fork) is LGPL-2.1, which allows the GPL in its place.
# A new license goes here only after it has been read for that.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "bzip2-1.0.6",
    "MPL-2.0",
    "LGPL-2.1",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]

# Every triple a release builds, so the one file covers each package's
# platform crates.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-dev-dependencies = true
workarounds = ["chrono", "rustls", "unicode-ident", "rustix", "linux-raw-sys"]

# ring's own license files, rather than the ISC header of every source
# file it would otherwise find. cargo-about's ring workaround stops at
# an older layout. A ring bump that changes these files changes their
# checksums. cargo-about only warns at that, and falls back to the
# sources' headers, so scripts/notices.sh fails on the warning until
# the checksums here are updated.
[ring.clarify]
license = "Apache-2.0 AND ISC"

[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"

[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"

# rawcolor: Apache-2.0 of its two.
[rawcolor.clarify]
license = "Apache-2.0"

[[rawcolor.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"

# The Windows crates' MIT text with its copyright line, which
